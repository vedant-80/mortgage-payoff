_ > nanoagent.plugin.v0001.ManifestConfig:
id: mortgage-payoff
name: Mortgage Payoff Calculator
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  calculate_mortgage_payoff:
    description: Calculate mortgage payoff time and interest under a specified monthly payment plan. Ask for balance, fixed annual interest rate, and monthly principal-and-interest payment if missing. Exclude escrow; pass null for unspecified recurring extra payments (zero). Do not amortize manually.

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  simulate-payoff:
    description: Calculate mortgage payoff time and interest under a specified monthly payment plan. Ask for balance, fixed annual interest rate, and monthly principal-and-interest payment if missing. Exclude escrow; pass null for unspecified recurring extra payments (zero). Do not amortize manually.
    runner: tool
    tools: [calculate_mortgage_payoff]
    reference: null
    instructions: Calculate the entire fixed-rate mortgage payoff in Python. Return compact baseline and extra-payment summaries, capped final payments, and explicit non-amortizing or 1200-month search-limit results. No model loop or full schedules.
